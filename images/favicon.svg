<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     width="128" height="128"
     role="img" aria-labelledby="title desc">
  <title id="title">Measure of a Mortal</title>
  <desc id="desc">
    An ivory cloaked figure holding a sword stands on a gold-edged
    summit beneath an eclipse, framed by an open gold ring.
    Transparent background.
  </desc>

  <!-- Symmetrical perimeter, reflected across x = 64. -->
  <path d="M55 10
           A53 53 0 0 0 31 104
           M73 10
           A53 53 0 0 1 97 104"
        fill="none"
        stroke="#C8A05A"
        stroke-width="5"/>

  <!-- Symmetrical corona and centered upper ray. -->
  <g fill="#C8A05A">
    <path d="M61 29 64 2 67 29Z"/>

    <path d="M49 33 42 21 54 30Z"/>
    <path d="M74 30 86 21 79 33Z"/>

    <path d="M42 43 30 39 42 49Z"/>
    <path d="M86 43 98 39 86 49Z"/>

    <path d="M44 56 33 65 49 61Z"/>
    <path d="M79 61 95 65 84 56Z"/>
  </g>

  <!-- Centered eclipse. -->
  <circle cx="64" cy="47" r="21"
          fill="#0B0B0A"
          stroke="#C8A05A"
          stroke-width="4"/>

  <!-- Symmetrical hood; intentionally asymmetrical cloak. -->
  <g stroke="#0B0B0A"
     stroke-width="2"
     stroke-linejoin="round">
    <path d="M59 66
             Q56 61 59 57
             Q64 51 69 57
             Q72 61 69 66Z"
          fill="#F0E5C9"/>

    <path d="M58 65
             Q65 62 71 67
             L77 77
             L83 82
             L80 87
             L73 82
             L75 100
             L65 105
             L56 102
             Q48 106 42 101
             Q34 103 28 97
             L23 96
             Q43 83 58 65Z"
          fill="#F0E5C9"/>
  </g>

  <!-- Broad cloak folds and centered hood inset. -->
  <g fill="#0B0B0A">
    <path d="M65 68
             Q53 89 32 97
             Q49 94 65 68Z"/>
    <path d="M69 73
             Q65 92 49 102
             L58 102
             Q68 91 69 73Z"/>
    <path d="M60 63 64 57 68 63Z"/>
  </g>

  <!-- Sword: consistent backing on shaft and crossguard. -->
  <g fill="none" stroke-linecap="butt">
    <path d="M82 84V106
             M77 86H87"
          stroke="#0B0B0A"
          stroke-width="6"/>
    <path d="M82 84V106
             M77 86H87"
          stroke="#F0E5C9"
          stroke-width="3"/>
  </g>

  <!-- Summit silhouette: exact bilateral symmetry. -->
  <path d="M18 119
           L42 104
           L53 102
           L64 96
           L75 102
           L86 104
           L110 119
           L91 124
           H37Z"
        fill="#0B0B0A"
        stroke="#C8A05A"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Both ridges centered on x = 64. -->
  <path d="M39 122 64 103 89 122
           M52 124 64 115 76 124"
        fill="none"
        stroke="#C8A05A"
        stroke-width="3"
        stroke-linejoin="round"/>
</svg>